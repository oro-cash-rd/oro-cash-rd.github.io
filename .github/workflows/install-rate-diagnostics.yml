name: Instalar y desplegar diagnóstico de tasa
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oro-cash-daily-publish
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar acceso existente
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Falta CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Aplicar parche comprobado sin sobrescribir cambios posteriores
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          expected = {'market.mjs': 'c14faa56da9a56785b79b8fff211cdc09bc95a52', 'workers/daily-rates/worker.mjs': '42ee34d26162fcefbb4bb380f34291c9bfdae261', 'workers/daily-rates/wrangler.jsonc': '29142df5d60f3d574c61b279bd847663b27c939b'}
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit('Cambio posterior detectado: ' + path)
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '18ce3e5a092c8f9bfb73ffb5f65d4d5a76c7797ae7044ea3f38ae92dabc4de56'
          Path('/tmp/rate-diagnostics.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/rate-diagnostics.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/rate-diagnostics.patch'], check=True)
          PYTHON
      - name: Probar con proveedor simulado
        run: npm test
      - name: Comprobar bundle antes de publicar
        run: npx --yes wrangler@4.149.0 deploy --dry-run --config workers/daily-rates/wrangler.jsonc
      - name: Publicar código verificado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.mjs workers/daily-rates/worker.mjs workers/daily-rates/wrangler.jsonc tests/diagnostics.test.mjs RATE_DIAGNOSTICS.md
          git commit -m 'Record sanitized shared rate attempt diagnostics'
          git push origin HEAD:main
      - name: Conservar la semilla del consumo previo
        run: node -e "const fs=require('fs');const budget=JSON.parse(fs.readFileSync('data/budget.json'));const rate=JSON.parse(fs.readFileSync('data/rates.json'));fs.writeFileSync('workers/daily-rates/seed.mjs','export default '+JSON.stringify({...budget,rate})+'\n')"
      - name: Desplegar sin consultar Metals.Dev ni cambiar su secreto
        run: npx --yes wrangler@4.149.0 deploy --config workers/daily-rates/wrangler.jsonc
      - name: Verificar diagnóstico sin consumir consultas
        run: |
          curl --fail --silent --show-error --max-time 30 -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' https://oro-cash-daily-rates.omartinezg930112.workers.dev/api/status > /tmp/rate-status.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/rate-status.json')); if(!Array.isArray(s.attempts)) throw new Error('Diagnostico no activo'); console.log(JSON.stringify(s));"
