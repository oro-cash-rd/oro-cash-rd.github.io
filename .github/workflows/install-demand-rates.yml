name: Instalar consulta diaria compartida
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oro-cash-daily-publish
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar candidato verificado sin sobrescribir otros cambios
        run: |
          node <<'SOURCE_JS'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const files = {".github/workflows/daily-rates.yml": "name: Tasa diaria y publicación\non:\n  workflow_dispatch:\n  schedule:\n    - cron: '17 4,5,6 * * *'\n  push:\n    branches: [main]\n    paths-ignore: ['data/**', 'MIGRATION.md']\npermissions:\n  contents: read\nconcurrency:\n  group: oro-cash-daily-publish\n  cancel-in-progress: false\njobs:\n  refresh:\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n      - run: npm test\n      - id: source\n        run: node -e \"const fs=require('fs'); const source=JSON.parse(fs.readFileSync('data/rates-source.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'demand=' + Boolean(source.mode === 'demand' && source.url) + '\\n')\"\n      - id: prepare\n        if: steps.source.outputs.demand != 'true'\n        run: node scripts/refresh.mjs prepare\n        env:\n          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}\n      - name: Reservar consulta antes de llamar al proveedor\n        if: steps.prepare.outputs.refresh == 'true'\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add data/budget.json\n          git commit -m 'Reserve daily market request'\n          git push origin HEAD:main\n      - name: Consultar Metals.Dev\n        if: steps.prepare.outputs.refresh == 'true'\n        run: node scripts/refresh.mjs fetch\n        env:\n          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}\n      - name: Conservar tasa del día\n        if: steps.prepare.outputs.refresh == 'true'\n        run: |\n          git add data/rates.json\n          git commit -m 'Update daily market rate'\n          git push origin HEAD:main\n      - name: Preparar web\n        run: |\n          mkdir -p _site/data\n          cp index.html styles.css app.js config.js market.mjs rates-client.mjs _site/\n          cp data/rates.json data/rates-source.json _site/data/\n          touch _site/.nojekyll\n      - uses: actions/upload-pages-artifact@v4\n        with:\n          path: _site\n  deploy:\n    needs: refresh\n    runs-on: ubuntu-latest\n    permissions:\n      pages: write\n      id-token: write\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - id: deployment\n        uses: actions/deploy-pages@v4\n", ".github/workflows/deploy-demand-rates.yml": "name: Activar tasa compartida por visita\non:\n  workflow_dispatch:\npermissions:\n  contents: read\nconcurrency:\n  # Avoid concurrent provider calls with the legacy job during the cutover.\n  group: oro-cash-daily-publish\n  cancel-in-progress: false\njobs:\n  activate:\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n      pages: write\n      id-token: write\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    env:\n      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\n      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n      - name: Comprobar configuración sin mostrar secretos\n        env:\n          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}\n        run: |\n          test -n \"$CLOUDFLARE_API_TOKEN\" || { echo 'Falta CLOUDFLARE_API_TOKEN'; exit 1; }\n          test -n \"$CLOUDFLARE_ACCOUNT_ID\" || { echo 'Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }\n          test -n \"$METALS_DEV_API_KEY\" || { echo 'Falta METALS_DEV_API_KEY'; exit 1; }\n      - run: npm test\n      - name: Conservar consumo previo de Metals.Dev\n        run: node -e \"const fs=require('fs');const budget=JSON.parse(fs.readFileSync('data/budget.json'));fs.writeFileSync('workers/daily-rates/seed.mjs','export default '+JSON.stringify(budget)+'\\n')\"\n      - name: Desplegar servicio\n        run: npx --yes wrangler@4.149.0 deploy --config workers/daily-rates/wrangler.jsonc\n      - name: Instalar la clave existente como secreto del servicio\n        env:\n          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}\n        run: printf '%s' \"$METALS_DEV_API_KEY\" | npx --yes wrangler@4.149.0 secret put METALS_DEV_API_KEY --config workers/daily-rates/wrangler.jsonc\n      - name: Validar servicio real antes de cambiar la web\n        run: node scripts/activate-cloudflare-rates.mjs\n      - name: Guardar URL pública y snapshot; ninguna clave\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add data/rates-source.json data/rates.json\n          if ! git diff --cached --quiet; then\n            git commit -m 'Activate shared on-demand daily rate service'\n            git push origin HEAD:main\n          fi\n      - name: Publicar Oro Cash conectado al servicio\n        run: |\n          mkdir -p _site/data\n          cp index.html styles.css app.js config.js market.mjs rates-client.mjs _site/\n          cp data/rates.json data/rates-source.json _site/data/\n          touch _site/.nojekyll\n      - uses: actions/upload-pages-artifact@v4\n        with:\n          path: _site\n      - id: deployment\n        uses: actions/deploy-pages@v4\n", "DEMAND_RATES.md": "# Tasa diaria compartida: Oro Cash y Merca Oro RD\n\n## Comportamiento\n\nEl primer visitante de Oro Cash de cada día dominicano llama al servicio HTTPS público `/api/rates`. Si nadie visita la web, la tarea de Merca Oro realiza esa misma llamada a las 09:00. El servicio consulta Metals.Dev para obtener oro USD/onza troy y USD/DOP en una sola respuesta. El primer resultado válido queda fijo hasta medianoche en `America/Santo_Domingo`.\n\nOro Cash y Merca Oro comparten ese snapshot, no hacen dos consultas independientes. Un Durable Object con almacenamiento SQLite conserva tasa y cuota, y serializa las solicitudes concurrentes. No guarda usuarios, teléfonos ni cotizaciones de clientes. Nunca se expone la clave en el navegador, la URL pública, el repositorio ni el prompt programado.\n\nNo se necesita GitHub para las consultas diarias una vez activado el servicio. GitHub sigue alojando la web y sirve para publicar cambios de código. El workflow antiguo deja de consultar al proveedor cuando `data/rates-source.json` indica `mode: demand`.\n\nSi el proveedor responde con datos inválidos/antiguos, falla o agota su cuota, se devuelve HTTP 503, sin reetiquetar la tasa previa como actual. Máximo tres intentos diarios, separados por al menos un minuto, y 95 mensuales, conservando el consumo previo de Actions durante la activación. Se reserva la llamada antes de realizarla para cubrir errores y reinicios.\n\n## Estado del candidato\n\nImplementado y probado localmente. **Todavía sin activar**: `data/rates-source.json` mantiene el modo anterior hasta que el endpoint real pase la validación. No confundir la preparación del código con el despliegue productivo.\n\n## Activación\n\n1. Crear/habilitar Workers en la cuenta Cloudflare del operador y configurar un subdominio `workers.dev`.\n2. En este repositorio, añadir los secretos Actions `CLOUDFLARE_ACCOUNT_ID` y `CLOUDFLARE_API_TOKEN`. El token necesita permisos para desplegar Workers, crear/migrar Durable Objects e instalar secretos en esa cuenta. Usar los permisos mínimos que Cloudflare requiera; no pegar credenciales en chats ni código.\n3. Reutilizar `METALS_DEV_API_KEY`, que ya existe en Actions. No hace falta leer ni volver a proporcionar su valor: el workflow lo pasa por stdin a `wrangler secret put`.\n4. Integrar el candidato y ejecutar **Activar tasa compartida por visita** desde `main`. Se serializa con el workflow legado para trasladar su consumo previo sin carreras.\n5. El workflow despliega el servicio, instala la clave, solicita una tasa real vigente, guarda la URL pública en `data/rates-source.json` y publica Oro Cash. Si cualquier comprobación falla antes de guardar la configuración, la web mantiene su fuente anterior.\n6. Verificar `/api/rates` dos veces y comprobar mismo `fetchedAt`; abrir Oro Cash sin clicar y comprobar la llamada; confirmar que la tarea obtiene la URL desde `data/rates-source.json` y usa el snapshot vigente.\n\nConsultar también el contador real de Metals.Dev si otros sistemas comparten la clave: el contador local solo registra las llamadas de esta integración. Reiniciar/recrear el Durable Object o trasladarlo de cuenta requiere conservar su cuota.\n\n## Merca Oro RD\n\nLa tarea lee `data/rates-source.json` de `main`. En modo `demand`, hace GET a `url`: una lectura provoca la consulta si falta la tasa del día. No necesita token de Metals.Dev. Validar día, timestamps, valores positivos, unidades y antigüedad antes de generar la imagen.\n\nOro Cash conserva su oferta de compra al 75% y sus convenciones de pureza. La imagen de Merca Oro calcula `gold * fx / 31.1034768 * quilates / 24`, con 10, 14, 18 y 24K, sin descuento de compra; redondeo final a dos decimales.\n\nNo hay promesa de disponibilidad infalible del proveedor ni de entrega de imágenes al segundo exacto: la tarea programada conserva las 09:00 RD, y una consulta/generación fallida debe notificarse. Nunca publicar una tasa antigua como vigente para cubrir una incidencia.\n\n## Validación\n\n`npm test`: cambio de día y mes dominicanos, 100 peticiones simultáneas, persistencia tras reinicio, cuota, cooldown, proveedor antiguo, cliente y ausencia de fallback vencido. `wrangler deploy --dry-run` verifica el bundle; la prueba real necesita las credenciales de despliegue.\n", "README.md": "# ORO CASH RD\n\nSitio estático en https://oro-cash-rd.github.io/ con cotización diaria de oro para fundición y valoración de joyas por WhatsApp.\n\nGitHub Actions consulta Metals.Dev y publica una tasa diaria fija para República Dominicana. La clave se guarda únicamente como secreto `METALS_DEV_API_KEY`. Si no hay una tasa vigente, no se muestra una cotización numérica. Los horarios programados pueden retrasarse; la web espera una tasa nueva antes de cotizar.\n\nEl candidato de consulta por primera visita y caché diaria compartida con Merca Oro está documentado en [DEMAND_RATES.md](DEMAND_RATES.md). Se activa solo después de verificar su servicio real; hasta entonces permanece la fuente anterior.\n\nEl cálculo se realiza en el navegador con peso, pureza y un porcentaje de compra de 75%. Las tasas y la fórmula son públicas. Las nuevas cotizaciones no se guardan en una base de datos.\n\nWhatsApp comercial: 18298568905. Android usa Intent, iOS usa whatsapp:// y escritorio usa wa.me. El cliente revisa y envía el mensaje; no se pide su teléfono.\n\nVer MIGRATION.md para operación, límites y retirada del servicio anterior. Pruebas: `npm test`.\n", "app.js": "import { quoteFor, isCurrent } from './market.mjs'\nimport { createRateClient } from './rates-client.mjs'\n(() => {\n  const cfg = window.ORO_CASH_CONFIG || {}\n  const businessWhatsapp = String(cfg.businessWhatsapp || '18298568905').replace(/\\D/g, '')\n  const $ = id => document.getElementById(id)\n  const state = { kind: null, karat: null, quote: null, generation: 0, loading: false }\n  let currentRate = null\n  const getRate = createRateClient()\n  async function loadRate() {\n    const rate = await getRate()\n    currentRate = rate\n    return rate\n  }\n  function expireQuote() {\n    if (!state.quote || !cfg.dailyRates) return\n    if (Date.now() < Date.parse(state.quote.valid_until)) return\n    state.quote = null\n    $('acceptOffer').removeAttribute('href')\n    $('quoteResult').classList.add('hidden')\n    $('quoteForm').classList.remove('hidden')\n    $('quoteError').textContent = 'Cambió el día. Vuelve a calcular con la tasa actualizada.'\n    $('quoteError').classList.remove('hidden')\n    sync()\n  }\n  setInterval(expireQuote, 1000)\n  document.addEventListener('visibilitychange', expireQuote)\n  window.addEventListener('focus', expireQuote)\n  $('acceptOffer').addEventListener('click', event => { expireQuote(); if (!state.quote) event.preventDefault() })\n  const money = value => new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP', maximumFractionDigits: 0 }).format(value).replace('DOP', 'RD$')\n  const time = iso => new Intl.DateTimeFormat('es-DO', { timeZone: 'America/Santo_Domingo', day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(iso))\n  // Native links stay on the user's click: no popup or asynchronous redirect.\n  const wa = message => {\n    const text = encodeURIComponent(message)\n    const query = `phone=${businessWhatsapp}&text=${text}`\n    const fallback = `https://wa.me/${businessWhatsapp}?text=${text}`\n    const ua = navigator.userAgent || ''\n    if (/Android/i.test(ua)) {\n      // Let Android resolve WhatsApp / WhatsApp Business; Chrome falls back if unavailable.\n      return `intent://send?${query}#Intent;scheme=whatsapp;S.browser_fallback_url=${encodeURIComponent(fallback)};end`\n    }\n    if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {\n      return `whatsapp://send?${query}`\n    }\n    return fallback\n  }\n  const weight = () => Number($('weight').value.replace(',', '.'))\n  const validWeight = () => Number.isFinite(weight()) && weight() > 0\n  const manual = () => state.kind === 'jewelry' || state.karat === 'unknown'\n  function sync() {\n    const jewelry = state.kind === 'jewelry'\n    const ready = Boolean(state.karat && (validWeight() || (jewelry && $('weightUnknown').checked)) && (!jewelry || $('jewelryType').value))\n    $('quoteButton').classList.toggle('hidden', manual())\n    $('detailsWhatsapp').classList.toggle('hidden', !manual())\n    $('quoteButton').disabled = !ready || state.loading\n    $('detailsWhatsapp').setAttribute('aria-disabled', String(!ready))\n    $('detailsWhatsapp').tabIndex = ready ? 0 : -1\n    if (ready) {\n      const description = jewelry ? `Quiero vender una joya: ${$('jewelryType').value}.` : 'Quiero vender oro para fundición.'\n      const grams = jewelry && $('weightUnknown').checked ? 'No lo sé' : `${weight()} g (aproximado)`\n      $('detailsWhatsapp').href = wa(`Hola, ORO CASH RD. ${description}\\nPeso: ${grams}.\\nQuilataje: ${state.karat === 'unknown' ? 'No lo sé' : state.karat}.\\nQuisiera una valoración y negociar con ustedes. Puedo compartir fotos de la pieza.`)\n    } else $('detailsWhatsapp').removeAttribute('href')\n    $('unknownNotice').classList.toggle('hidden', state.karat !== 'unknown')\n  }\n  document.querySelectorAll('[data-kind]').forEach(button => button.addEventListener('click', () => {\n    state.kind = button.dataset.kind\n    if (state.kind === 'scrap') loadRate().catch(() => {})\n    button.parentElement.classList.remove('awaiting-choice')\n    state.generation++\n    state.loading = false\n    state.quote = null\n    document.querySelectorAll('[data-kind]').forEach(b => { b.classList.toggle('active', b === button); b.setAttribute('aria-pressed', String(b === button)) })\n    const jewelry = state.kind === 'jewelry'\n    $('detailsPanel').classList.remove('hidden')\n    $('jewelryField').classList.toggle('hidden', !jewelry)\n    $('weightUnknownLabel').classList.toggle('hidden', !jewelry)\n    $('weight').disabled = jewelry && $('weightUnknown').checked\n    $('modeHint').textContent = jewelry ? 'Describe tu joya y negocia su valoración por WhatsApp.' : 'Calculamos el valor del oro por peso y pureza, como material para fundición.'\n    $('formNote').textContent = jewelry ? 'Sin oferta automática. Revisamos tu pieza contigo.' : 'Estimación orientativa. Confirmamos peso y pureza presencialmente.'\n    $('quoteResult').classList.add('hidden')\n    $('quoteForm').classList.remove('hidden')\n    $('quoteError').classList.add('hidden')\n    $('quoteButton').textContent = 'CALCULAR VALOR DEL METAL →'\n    sync()\n  }))\n  document.querySelectorAll('[data-karat]').forEach(button => button.addEventListener('click', () => {\n    state.karat = button.dataset.karat\n    document.querySelectorAll('[data-karat]').forEach(b => { b.classList.toggle('active', b === button); b.setAttribute('aria-pressed', String(b === button)) })\n    sync()\n  }))\n  $('weight').addEventListener('input', () => { $('weight').value = $('weight').value.replace(/[^0-9.,]/g, '').slice(0, 10); sync() })\n  $('jewelryType').addEventListener('change', sync)\n  $('weightUnknown').addEventListener('change', () => { $('weight').disabled = $('weightUnknown').checked; sync() })\n  $('detailsWhatsapp').addEventListener('click', event => { if ($('detailsWhatsapp').getAttribute('aria-disabled') === 'true') event.preventDefault() })\n  $('quoteButton').addEventListener('click', async () => {\n    if (state.kind !== 'scrap' || manual() || !validWeight() || !state.karat || state.loading) return\n    const generation = ++state.generation\n    state.loading = true\n    $('quoteButton').disabled = true\n    $('quoteButton').textContent = 'Calculando…'\n    $('quoteError').classList.add('hidden')\n    try {\n      const rate = isCurrent(currentRate) ? currentRate : await loadRate()\n      const quote = quoteFor(weight(), state.karat, rate)\n      if (generation !== state.generation) return\n      state.quote = quote\n      $('resultAmount').textContent = money(quote.estimated_offer_dop)\n      $('resultMeta').textContent = `${Number(quote.weight_grams).toFixed(2)} g · Oro ${quote.karat}`\n      $('resultTime').textContent = `Tasa del día · ${time(quote.last_updated_at)}`\n      $('staleWarning').classList.toggle('hidden', !quote.market_stale)\n      $('acceptOffer').href = wa(`Hola, ORO CASH RD. Quiero vender oro para fundición.\\nPeso: ${quote.weight_grams} g.\\nQuilataje: ${quote.karat}.\\nEstimación del metal: ${money(quote.estimated_offer_dop)} (sujeta a verificación).\\nReferencia: ${quote.quote_id}.\\nQuisiera conversar y coordinar una evaluación.`)\n      $('quoteForm').classList.add('hidden')\n      $('quoteResult').classList.remove('hidden')\n    } catch (error) {\n      if (generation !== state.generation) return\n      $('quoteError').textContent = error.name === 'TimeoutError' || error.name === 'TypeError' ? 'No pudimos consultar la tasa de hoy. Intenta más tarde o escríbenos por WhatsApp.' : (error.message || 'Cotización no disponible. Escríbenos por WhatsApp.')\n      $('quoteError').classList.remove('hidden')\n    } finally {\n      if (generation === state.generation) {\n        state.loading = false\n        $('quoteButton').textContent = 'CALCULAR VALOR DEL METAL →'\n        sync()\n      }\n    }\n  })\n  $('resetQuote').addEventListener('click', () => { state.quote = null; $('quoteResult').classList.add('hidden'); $('quoteForm').classList.remove('hidden'); sync() })\n  sync()\n  // Opening the page refreshes the shared daily snapshot, even without a click.\n  loadRate().catch(() => {})\n})()\n", "data/rates-source.json": "{\n  \"mode\": \"legacy\",\n  \"url\": null\n}\n", "package.json": "{\"private\":true,\"scripts\":{\"test\":\"node --test tests/*.test.mjs\"}}\n", "rates-client.mjs": "import { isCurrent } from './market.mjs'\n\n// Configuration is public; the provider key lives only in the rate service.\nexport function createRateClient({ fetcher = fetch, now = Date.now } = {}) {\n  let configuration, snapshot, pending\n  async function load() {\n    configuration ??= await (async () => {\n      const response = await fetcher('./data/rates-source.json', { cache: 'no-store' })\n      if (!response.ok) throw new Error('Configuración de tasas no disponible.')\n      const source = await response.json()\n      if (source.url) {\n        const url = new URL(source.url)\n        if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) throw new Error('Servicio de tasas inválido.')\n      }\n      return source\n    })()\n    const endpoint = configuration.url || './data/rates.json'\n    const response = await fetcher(endpoint, { cache: 'no-store', signal: AbortSignal.timeout(20000) })\n    if (!response.ok) throw new Error('No pudimos obtener la tasa de hoy. Intenta más tarde o escríbenos por WhatsApp.')\n    const rate = await response.json()\n    if (!isCurrent(rate, now())) throw new Error('La tasa de hoy todavía no está disponible.')\n    snapshot = rate\n    return rate\n  }\n  return async () => {\n    if (isCurrent(snapshot, now())) return snapshot\n    if (!pending) pending = load().finally(() => { pending = null })\n    return pending\n  }\n}\n", "scripts/activate-cloudflare-rates.mjs": "import { spawnSync } from 'node:child_process'\n\nconst account = process.env.CLOUDFLARE_ACCOUNT_ID\nconst token = process.env.CLOUDFLARE_API_TOKEN\nif (!account || !token) throw new Error('Falta la configuración de Cloudflare.')\nconst response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/workers/subdomain`, {\n  headers: { Authorization: `Bearer ${token}` },\n  signal: AbortSignal.timeout(15000), redirect: 'error'\n})\nif (!response.ok) throw new Error('No se pudo comprobar el subdominio público del servicio.')\nconst payload = await response.json()\nconst subdomain = payload.result?.subdomain\nif (!payload.success || typeof subdomain !== 'string' || !/^[a-z0-9-]+$/.test(subdomain)) throw new Error('Configura primero un subdominio workers.dev en Cloudflare.')\nconst endpoint = `https://oro-cash-daily-rates.${subdomain}.workers.dev/api/rates`\nconst child = spawnSync(process.execPath, ['scripts/activate-demand-rates.mjs', endpoint], { stdio: 'inherit' })\nif (child.status !== 0) process.exit(child.status || 1)\n", "scripts/activate-demand-rates.mjs": "import { writeFile } from 'node:fs/promises'\nimport { isCurrent } from '../market.mjs'\n\nconst endpoint = new URL(process.argv[2])\nif (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password || endpoint.search || endpoint.hash || endpoint.pathname !== '/api/rates') throw new Error('Se requiere URL HTTPS pública /api/rates sin credenciales.')\nconst response = await fetch(endpoint, { signal: AbortSignal.timeout(20000), cache: 'no-store', redirect: 'error' })\nif (!response.ok) throw new Error('El servicio no devuelve una tasa vigente; no se activa.')\nconst rate = await response.json()\nif (!isCurrent(rate)) throw new Error('La tasa no corresponde al día dominicano actual; no se activa.')\nconst stamp = Date.now()\nfor (const value of [rate.metalTimestamp, rate.currencyTimestamp]) {\n  const time = Date.parse(value)\n  if (!Number.isFinite(time) || time > rate.fetchedAt + 120000 || stamp - time >= 86400000) throw new Error('Timestamp inválido; no se activa.')\n}\nawait writeFile('data/rates-source.json', JSON.stringify({ mode: 'demand', url: endpoint.href }, null, 2) + '\\n')\nawait writeFile('data/rates.json', JSON.stringify(rate, null, 2) + '\\n')\n// The snapshot is just a public mirror; new daily requests go to the service.\nconsole.log('Servicio de tasas validado y configuración preparada.')\n", "tests/demand-rates.test.mjs": "import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport worker, { DailyRates } from '../workers/daily-rates/worker.mjs'\nimport { createRateClient } from '../rates-client.mjs'\n\nconst START = Date.parse('2026-10-12T12:00:00Z')\nfunction context(map = new Map()) {\n  let queue = Promise.resolve()\n  return {\n    storage: { get: async key => structuredClone(map.get(key)), put: async (key, value) => map.set(key, structuredClone(value)) },\n    blockConcurrencyWhile(callback) {\n      const result = queue.then(callback)\n      queue = result.catch(() => {})\n      return result\n    }\n  }\n}\nconst provider = at => ({ status: 'success', currency: 'USD', unit: 'toz', metals: { gold: 4200 }, currencies: { DOP: 1 / 61 }, timestamps: { metal: new Date(at - 1000).toISOString(), currency: new Date(at - 2000).toISOString() } })\n\ntest('100 simultaneous visitors and Merca Oro share one durable daily call; midnight refreshes once', async () => {\n  const oldNow = Date.now, oldFetch = globalThis.fetch\n  let clock = START, calls = 0\n  const map = new Map()\n  Date.now = () => clock\n  globalThis.fetch = async () => { calls++; await new Promise(resolve => setTimeout(resolve, 5)); return Response.json(provider(clock)) }\n  try {\n    const service = new DailyRates(context(map), { METALS_DEV_API_KEY: 'test-only' })\n    const responses = await Promise.all(Array.from({ length: 100 }, () => service.fetch()))\n    const bodies = await Promise.all(responses.map(response => response.json()))\n    assert.equal(calls, 1)\n    assert.equal(map.get('budget').monthly, 1)\n    assert.ok(bodies.every(body => body.day === '2026-10-12' && body.fetchedAt === START))\n    clock = Date.parse('2026-10-13T03:59:59Z')\n    const restarted = new DailyRates(context(map), { METALS_DEV_API_KEY: 'test-only' })\n    assert.equal((await (await restarted.fetch()).json()).fetchedAt, START)\n    assert.equal(calls, 1)\n    clock = Date.parse('2026-10-13T04:00:00Z')\n    assert.equal((await (await restarted.fetch()).json()).day, '2026-10-13')\n    assert.equal(calls, 2)\n  } finally { Date.now = oldNow; globalThis.fetch = oldFetch }\n})\n\ntest('invalid/old provider data cannot replace snapshot; retry cooldown and durable 3/day quota', async () => {\n  const oldNow = Date.now, oldFetch = globalThis.fetch\n  let clock = START, calls = 0\n  const oldRate = { day: '2026-10-11', fetchedAt: START - 86400000, gold: 4194, fx: 61 }\n  const map = new Map([['rate', oldRate]])\n  Date.now = () => clock\n  globalThis.fetch = async () => { calls++; return Response.json(provider(clock - 600000)) }\n  try {\n    const service = new DailyRates(context(map), { METALS_DEV_API_KEY: 'test-only' })\n    assert.equal((await service.fetch()).status, 503)\n    assert.deepEqual(map.get('rate'), oldRate)\n    assert.equal((await service.fetch()).status, 503)\n    assert.equal(calls, 1)\n    clock += 60000; await service.fetch()\n    clock += 60000; await service.fetch()\n    clock += 60000\n    assert.equal((await (await new DailyRates(context(map), { METALS_DEV_API_KEY: 'test-only' }).fetch()).json()).error, 'provider_quota_limit')\n    assert.equal(calls, 3)\n    assert.equal(map.get('budget').monthly, 3)\n    assert.deepEqual(map.get('rate'), oldRate)\n  } finally { Date.now = oldNow; globalThis.fetch = oldFetch }\n})\n\ntest('monthly quota persists across dates, resets at Dominican month boundary, and missing key makes no call', async () => {\n  const oldNow = Date.now, oldFetch = globalThis.fetch\n  let clock = Date.parse('2026-11-01T03:59:59Z'), calls = 0\n  const map = new Map([['budget', { day: '2026-10-12', month: '2026-10', daily: 0, monthly: 95 }]])\n  Date.now = () => clock\n  globalThis.fetch = async () => { calls++; return Response.json(provider(clock)) }\n  try {\n    const service = new DailyRates(context(map), { METALS_DEV_API_KEY: 'test-only' })\n    assert.equal((await service.fetch()).status, 503)\n    assert.equal(calls, 0)\n    clock += 1000\n    assert.equal((await service.fetch()).status, 200)\n    assert.equal(map.get('budget').monthly, 1)\n    const empty = new DailyRates(context(), {})\n    assert.equal((await empty.fetch()).status, 503)\n    assert.equal(calls, 1)\n  } finally { Date.now = oldNow; globalThis.fetch = oldFetch }\n})\n\ntest('worker is public read-only, errors contain no provider key, OPTIONS does not query provider', async () => {\n  const env = { METALS_DEV_API_KEY: 'private-test-secret', DAILY_RATES: { idFromName: () => 'one', get: () => ({ fetch: async () => Response.json({ day: '2026-10-12' }) }) } }\n  assert.equal((await worker.fetch(new Request('https://service/api/rates', { method: 'POST' }), env)).status, 405)\n  assert.equal((await worker.fetch(new Request('https://service/api/rates', { method: 'OPTIONS' }), env)).status, 204)\n  assert.equal((await worker.fetch(new Request('https://service/nope'), env)).status, 404)\n  const response = await worker.fetch(new Request('https://service/api/rates'), env)\n  assert.equal(response.status, 200)\n  assert.equal((await response.text()).includes('private-test-secret'), false)\n})\n\ntest('browser first visit calls demand service, deduplicates, caches until midnight, fails closed without static fallback', async () => {\n  let clock = START, calls = 0\n  const urls = []\n  let broken = false\n  const get = createRateClient({ now: () => clock, fetcher: async url => {\n    urls.push(url)\n    if (url === './data/rates-source.json') return Response.json({ mode: 'demand', url: 'https://service.example/api/rates' })\n    calls++\n    if (broken) return Response.json({ error: 'fresh_rate_unavailable' }, { status: 503 })\n    return Response.json({ day: '2026-10-12', fetchedAt: START, gold: 4200, fx: 61 })\n  } })\n  const values = await Promise.all(Array.from({ length: 10 }, () => get()))\n  assert.equal(calls, 1)\n  assert.ok(values.every(value => value.fetchedAt === START))\n  clock += 3600000; await get(); assert.equal(calls, 1)\n  clock = Date.parse('2026-10-13T04:00:00Z'); broken = true\n  await assert.rejects(get())\n  assert.equal(calls, 2)\n  assert.equal(urls.includes('./data/rates.json'), false)\n})\n", "workers/daily-rates/seed.mjs": "// Deployment regenerates this file from the existing provider quota ledger.\nexport default { day: '', month: '', daily: 0, monthly: 0 }\n", "workers/daily-rates/worker.mjs": "import { dayKey, parseMarket, isCurrent } from '../../market.mjs'\nimport seed from './seed.mjs'\n\nconst json = (body, status = 200, retry = null) => new Response(JSON.stringify(body), {\n  status,\n  headers: {\n    'Content-Type': 'application/json; charset=utf-8',\n    'Cache-Control': 'no-store',\n    'Access-Control-Allow-Origin': '*',\n    ...(retry ? { 'Retry-After': String(retry) } : {})\n  }\n})\n\n// One global object serializes both Oro Cash visits and Merca Oro requests.\nexport class DailyRates {\n  constructor(ctx, env) { this.ctx = ctx; this.env = env }\n  async fetch() {\n    return this.ctx.blockConcurrencyWhile(async () => {\n      const now = Date.now(), day = dayKey(now), month = day.slice(0, 7)\n      const rate = await this.ctx.storage.get('rate')\n      if (isCurrent(rate, now)) return json(rate)\n      if (!this.env.METALS_DEV_API_KEY) return json({ error: 'service_not_configured', day }, 503)\n      const prior = (await this.ctx.storage.get('budget')) || seed\n      const budget = {\n        day, month,\n        daily: prior.day === day ? prior.daily : 0,\n        monthly: prior.month === month ? prior.monthly : 0,\n        nextAttemptAt: prior.day === day ? prior.nextAttemptAt || 0 : 0\n      }\n      if (budget.daily >= 3 || budget.monthly >= 95) return json({ error: 'provider_quota_limit', day }, 503)\n      if (now < budget.nextAttemptAt) return json({ error: 'provider_retry_pending', day }, 503, Math.ceil((budget.nextAttemptAt - now) / 1000))\n      // Count before the outbound request: crashes and failed calls still consume quota.\n      budget.daily++\n      budget.monthly++\n      budget.nextAttemptAt = now + 60000\n      await this.ctx.storage.put('budget', budget)\n      try {\n        const url = new URL('https://api.metals.dev/v1/latest')\n        url.search = new URLSearchParams({ api_key: this.env.METALS_DEV_API_KEY, currency: 'USD', unit: 'toz' })\n        const response = await fetch(url, { signal: AbortSignal.timeout(10000), redirect: 'error' })\n        if (!response.ok) throw new Error('provider_failed')\n        const result = parseMarket(await response.json(), Date.now())\n        await this.ctx.storage.put('rate', result)\n        return json(result)\n      } catch {\n        // Do not leak URLs, keys or provider error bodies; never re-date old data.\n        return json({ error: 'fresh_rate_unavailable', day: dayKey(Date.now()) }, 503, 60)\n      }\n    })\n  }\n}\n\nexport default {\n  async fetch(request, env) {\n    const path = new URL(request.url).pathname\n    if (path === '/health') return json({ service: 'oro-cash-daily-rates', configured: Boolean(env.METALS_DEV_API_KEY) })\n    if (path !== '/api/rates') return json({ error: 'not_found' }, 404)\n    if (request.method === 'OPTIONS') return new Response(null, { status: 204, headers: { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'GET, OPTIONS', 'Access-Control-Max-Age': '86400' } })\n    if (request.method !== 'GET') return json({ error: 'method_not_allowed' }, 405)\n    const object = env.DAILY_RATES.get(env.DAILY_RATES.idFromName('shared-dop-gold'))\n    return object.fetch('https://internal/api/rates')\n  }\n}\n", "workers/daily-rates/wrangler.jsonc": "{\n  \"name\": \"oro-cash-daily-rates\",\n  \"main\": \"worker.mjs\",\n  \"compatibility_date\": \"2026-10-01\",\n  \"workers_dev\": true,\n  \"durable_objects\": {\n    \"bindings\": [{ \"name\": \"DAILY_RATES\", \"class_name\": \"DailyRates\" }]\n  },\n  \"migrations\": [{ \"tag\": \"v1\", \"new_sqlite_classes\": [\"DailyRates\"] }]\n}\n"};
          const baseline = {".github/workflows/daily-rates.yml": "f4435bc07c97f9034a3b9805cdce1409b3865499f13ed337126ee71265338725", ".github/workflows/deploy-demand-rates.yml": null, "DEMAND_RATES.md": null, "README.md": "a1a4b08b4ca69a0152ccc6306761e5b04647c6ede205689a6341667b27cae2c3", "app.js": "d3389acf0d2a87086e4eac739c47885228f14a1e69a46b42673d8d631acae664", "data/rates-source.json": null, "package.json": "f009a819aa4c724f7777e1992c831546d037b7d00d79653912bdef6296e8c0a4", "rates-client.mjs": null, "scripts/activate-cloudflare-rates.mjs": null, "scripts/activate-demand-rates.mjs": null, "tests/demand-rates.test.mjs": null, "workers/daily-rates/seed.mjs": null, "workers/daily-rates/worker.mjs": null, "workers/daily-rates/wrangler.jsonc": null};
