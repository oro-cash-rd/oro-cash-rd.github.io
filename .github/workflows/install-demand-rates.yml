name: Instalar consulta diaria compartida
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oro-cash-daily-publish
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar candidato verificado sin sobrescribir otros cambios
        run: |
          node <<'SOURCE_JS'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const encoded = {"DEMAND_RATES.md": "", "README.md": "", "app.js": "", "data/rates-source.json": "ewogICJtb2RlIjogImxlZ2FjeSIsCiAgInVybCI6IG51bGwKfQo=", "package.json": "eyJwcml2YXRlIjp0cnVlLCJzY3JpcHRzIjp7InRlc3QiOiJub2RlIC0tdGVzdCB0ZXN0cy8qLnRlc3QubWpzIn19Cg==", "rates-client.mjs": "", "scripts/activate-cloudflare-rates.mjs": "", "scripts/activate-demand-rates.mjs": "", "tests/demand-rates.test.mjs": "", "workers/daily-rates/seed.mjs": "Ly8gRGVwbG95bWVudCByZWdlbmVyYXRlcyB0aGlzIGZpbGUgZnJvbSB0aGUgZXhpc3RpbmcgcHJvdmlkZXIgcXVvdGEgbGVkZ2VyLgpleHBvcnQgZGVmYXVsdCB7IGRheTogJycsIG1vbnRoOiAnJywgZGFpbHk6IDAsIG1vbnRobHk6IDAgfQo=", "workers/daily-rates/worker.mjs": "", "workers/daily-rates/wrangler.jsonc": ""};
          const files = Object.fromEntries(Object.entries(encoded).map(([name, value]) => [name, Buffer.from(value, 'base64').toString('utf8')]));
          const baseline = {"DEMAND_RATES.md": null, "README.md": "a1a4b08b4ca69a0152ccc6306761e5b04647c6ede205689a6341667b27cae2c3", "app.js": "d3389acf0d2a87086e4eac739c47885228f14a1e69a46b42673d8d631acae664", "data/rates-source.json": null, "package.json": "f009a819aa4c724f7777e1992c831546d037b7d00d79653912bdef6296e8c0a4", "rates-client.mjs": null, "scripts/activate-cloudflare-rates.mjs": null, "scripts/activate-demand-rates.mjs": null, "tests/demand-rates.test.mjs": null, "workers/daily-rates/seed.mjs": null, "workers/daily-rates/worker.mjs": null, "workers/daily-rates/wrangler.jsonc": null};
          for (const [file, content] of Object.entries(files)) {
            const exists = fs.existsSync(file);
            const current = exists ? crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') : null;
            const desired = crypto.createHash('sha256').update(content).digest('hex');
            if (current !== baseline[file] && current !== desired) throw new Error('Source changed; inspect before applying: ' + file);
          }
          for (const [file, content] of Object.entries(files)) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content);
          }
          SOURCE_JS
      - run: npm test
      - run: node --check app.js
      - name: Guardar el candidato
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEMAND_RATES.md README.md app.js data/rates-source.json package.json rates-client.mjs scripts/activate-cloudflare-rates.mjs scripts/activate-demand-rates.mjs tests/demand-rates.test.mjs workers/daily-rates/seed.mjs workers/daily-rates/worker.mjs workers/daily-rates/wrangler.jsonc
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare shared on-demand daily rates with safe activation'
            git push origin HEAD:main
          fi
      - name: Publicar cliente compatible con la fuente anterior
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js config.js market.mjs rates-client.mjs _site/
          cp data/rates.json data/rates-source.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
